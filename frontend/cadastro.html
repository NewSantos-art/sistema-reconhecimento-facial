<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - FaceID Security</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <span class="navbar-brand">🔍 Reconhecimento Facial Moderno</span>
            <a href="index.html" class="btn btn-outline-light btn-sm">← Voltar</a>
        </div>
    </nav>

    <div class="container mt-5">
        <h2 class="mb-4">Cadastro de Pessoa</h2>
        <div class="card p-4">
            <div class="mb-3">
                <label class="form-label">Nome completo</label>
                <input type="text" id="nome" class="form-control" placeholder="Digite o nome">
            </div>
            <div class="mb-3">
                <label class="form-label">CPF</label>
                <input type="text" id="cpf" class="form-control" placeholder="000.000.000-00">
            </div>
            <div class="mb-3">
                <label class="form-label">Fotos faciais</label>
                <input type="file" id="fotos" class="form-control" multiple accept="image/*">
                <small class="text-muted">Selecione de 3 a 10 fotos em diferentes ângulos</small>
            </div>
            <button onclick="cadastrar()" class="btn btn-primary">Cadastrar</button>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal fade" id="modalResultado" tabindex="-1" data-bs-backdrop="static" data-bs-keyboard="false">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Cadastro de Pessoa</h5>
                </div>
                <div class="modal-body" id="modalConteudo"></div>
                <div class="modal-footer" id="modalFooter" style="display:none;">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fechar</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
    <script src="js/cadastro.js"></script>
</body>
</html>
