<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reconhecimento por Imagem - FaceID Security</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <span class="navbar-brand">🔍 FaceID Security</span>
            <a href="index.html" class="btn btn-outline-light btn-sm">← Voltar</a>
        </div>
    </nav>

    <div class="container mt-5">
        <h2 class="mb-4">Reconhecimento por Imagem</h2>
        <div class="card p-4">
            <div class="mb-3">
                <label class="form-label">Envie uma foto para identificar</label>
                <input type="file" id="imagem" class="form-control" accept="image/*">
            </div>
            <button onclick="reconhecer()" class="btn btn-primary">Identificar</button>
        </div>
    </div>

    <!-- Modal de resultado -->
    <div class="modal fade" id="modalResultado" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Resultado do Reconhecimento</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="modalConteudo"></div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fechar</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
    <script src="js/imagem.js"></script>
</body>
</html>
