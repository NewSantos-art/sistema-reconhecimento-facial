<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webcam - FaceID Security</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <span class="navbar-brand">🔍 Reconhecimento Facial Moderno</span>
            <a href="index.html" class="btn btn-outline-light btn-sm">← Voltar</a>
        </div>
    </nav>

    <div class="container mt-5">
        <h2 class="mb-4">Reconhecimento por Webcam</h2>
        <div class="row">
            <div class="col-md-8">
                <div class="card p-3">
                    <video id="video" width="100%" autoplay playsinline></video>
                    <canvas id="canvas" style="display:none;"></canvas>
                    <div class="mt-3 d-flex gap-2">
                        <button onclick="iniciarCamera()" class="btn btn-success">▶ Iniciar Câmera</button>
                        <button onclick="capturarEReconhecer()" class="btn btn-primary">📸 Identificar</button>
                        <button onclick="pararCamera()" class="btn btn-danger">⏹ Parar</button>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card p-3">
                    <h6>Resultado</h6>
                    <div id="resultado"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal fade" id="modalResultado" tabindex="-1" data-bs-backdrop="static">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Resultado do Reconhecimento</h5>
                </div>
                <div class="modal-body" id="modalConteudo"></div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fechar</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
    <script src="js/webcam.js"></script>
</body>
</html>
